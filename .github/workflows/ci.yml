name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (Testcontainers)
        run: pnpm test:int
      - run: pnpm build

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @testrex/web exec playwright install --with-deps chromium
      - name: Playwright (includes axe WCAG 2.1 AA checks)
        run: pnpm --filter @testrex/web e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Create .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^APP_SECRET=.*/APP_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 12)/" .env
      - name: Build images
        working-directory: deploy
        run: docker compose build
      - name: Start stack
        working-directory: deploy
        run: docker compose up -d
      - name: Wait for readiness (spec - healthy within 120 s)
        run: node scripts/smoke-test.mjs --timeout 120 http://localhost:8080/readyz http://localhost:8080/
      - name: Verify data survives restart
        working-directory: deploy
        run: |
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE smoke_persist (v int); INSERT INTO smoke_persist VALUES (42);"'
          docker compose down
          docker compose up -d
          node ../scripts/smoke-test.mjs --timeout 120 http://localhost:8080/readyz
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT v FROM smoke_persist"' | grep -qx 42
      - name: Show logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
